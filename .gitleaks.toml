# Configuración de gitleaks para 1platform-content-ai.
# Documenta los ÚNICOS falsos-positivos permitidos: la clave de app pública que el plugin embebe
# (identificador, no secreto; ver la nota junto a su entrada).
#
# IMPORTANTE (seguridad — CA-12/RF-10): los regexes del allowlist son **literales y anclados** para
# que NO silencien credenciales REALES. Re-medido 2026-10-12 con gitleaks 8.30.1 sobre main
# (4b1a9bd): 2 hallazgos sin allowlist, resueltos abajo. Control negativo: un `ghp_` + 36
# alfanuméricos aleatorios, un JWT completo, una `sk-proj-…` y una `sk-ant-api03-…` sembrados
# fuera del repo siguen marcando.

[extend]
useDefault = true

[allowlist]
description = "Ejemplos de documentación (placeholders ilustrativos) + artefactos de build"

paths = [
  '''vendor/.*''',
  '''node_modules/.*''',
  '''\.phpunit\.result\.cache''',
  '''\.gitleaks\.toml''',
]

regexes = [
  # Quitados 2026-10-12 por no casar con NINGÚN hallazgo del árbol (gitleaks 8.30.1 sin allowlist
  # sobre main 4b1a9bd: 2 hallazgos, ninguno de estas formas): JWT truncados con `...`, el patrón
  # corto `^(?:ak|sk)-…{2,28}$` y el UUID FEL `A1B2C3D4…`. Si un ejemplo vuelve, se agrega su literal.
  #
  # ── Clave de app PÚBLICA del plugin (`app_key` de `includes/services/config/Config.php`) ──────
  # Una por entorno (`staging` → api-qa, `production` → api). Es un IDENTIFICADOR PÚBLICO por
  # decisión del dueño (2026-09-21, content-ai#205 cerrado como aceptado): viaja en el .zip de cada
  # WordPress y un cliente distribuido no puede guardar un secreto; lo que la vuelve tolerable es que
  # un app-token solo alcanza las rutas congeladas por `test_app_token_only_surface.py` en
  # 1platform-api. Literales y anclados: cualquier otra clave en ese archivo sigue marcando.
  '''^v36MA4qV4OnSR8eKordujzkQNMx7y0VIh7Qkeoko87K3KOvfJtTef04SWARvG7nG$''',
  '''^mJTS3UxQA6vNOKdrJ2A2jLjgMEKo4tghOG7P2VqoKrs5fafy0TykA3b7pMRzdQod$''',
]

# Reglas propias: el ruleset por defecto de gitleaks NO tiene una regla dedicada para las API keys
# de Anthropic ni para las de proyecto/servicio de OpenAI (sólo las caza por casualidad la heurística
# genérica `generic-api-key`, y sólo si el nombre de variable "suena" a credencial). El piso de
# longitud (80/40 chars) es lo que las separa de los placeholders cortos `ak-`/`sk-` de los
# ejemplos de documentación. Medido 2026-09-07 con gitleaks 8.30.1.
# Refs 1platformlabs/1platform-wiki#7

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-…)"
regex = 'sk-ant-(?:api|admin|sid)[0-9]{2}-[A-Za-z0-9_-]{80,120}'
keywords = ["sk-ant-"]

[[rules]]
id = "openai-project-key"
description = "OpenAI project/user key (sk-proj-, sk-svcacct-, sk-admin-)"
regex = 'sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,}'
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]
