name: 1Platform Content AI — QA

# Sólo build + publicación del pre-release de QA (GitHub Release, NO wordpress.org).
# La verificación (PHPUnit 8.1/8.2/8.3, lint, Sonar, versiones) corre en local: /local-checks.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PHP_VERSION_PROD: "8.3"
  PHP_EXTENSIONS: "mbstring, xml, curl, mysql"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa-release:
    name: QA Release (.zip)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "Version:\s*\K[\d.]+" 1platform-content-ai.php)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION_PROD }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Build plugin zip
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=$(mktemp -d)
          PLUGIN_DIR="${BUILD_DIR}/1platform-content-ai"
          mkdir -p "${PLUGIN_DIR}"

          # Copy files excluding .distignore entries
          if [ -f .distignore ]; then
            rsync -av --exclude-from='.distignore' ./ "${PLUGIN_DIR}/"
          else
            rsync -av \
              --exclude='.github' \
              --exclude='.claude' \
              --exclude='tests' \
              --exclude='.git' \
              --exclude='.gitignore' \
              --exclude='.editorconfig' \
              --exclude='composer.json' \
              --exclude='composer.lock' \
              --exclude='phpunit.xml.dist' \
              --exclude='CLAUDE.md' \
              --exclude='PIPELINE_PLAN.md' \
              --exclude='CHANGELOG.md' \
              --exclude='.distignore' \
              --exclude='vendor/bin' \
              ./ "${PLUGIN_DIR}/"
          fi

          ZIP_NAME="1platform-content-ai-qa-${VERSION}-rc${PR_NUMBER}.zip"
          cd "${BUILD_DIR}"
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" 1platform-content-ai/
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "build_dir=${BUILD_DIR}" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" \
            --json title,body,commits,files,additions,deletions > pr_data.json 2>/dev/null || echo '{}' > pr_data.json

          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          pr_number = os.environ.get("PR_NUMBER", "")
          version = os.environ.get("VERSION", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")

          data = json.loads(Path("pr_data.json").read_text(encoding="utf-8", errors="replace"))
          pr_title = data.get("title", f"PR #{pr_number}")
          pr_body = data.get("body", "")
          commits_list = data.get("commits", [])
          commits = "\n".join(f"- {c.get('messageHeadline', '')}" for c in commits_list) if commits_list else ""
          files_changed = len(data.get("files", []))
          additions = data.get("additions", 0)
          deletions = data.get("deletions", 0)

          lines = []
          lines.append(f"> ⚠️ **Pre-release — Not for production use.**\n")
          lines.append(f"### PR #{pr_number}: {pr_title}\n")

          if pr_body and pr_body != "null":
              lines.append("#### Description\n")
              lines.append(f"{pr_body}\n")

          if commits:
              lines.append("#### Commits\n")
              lines.append(f"{commits}\n")

          lines.append("#### Stats")
          lines.append(f"- **Files changed:** {files_changed}")
          lines.append(f"- **Additions:** +{additions}")
          lines.append(f"- **Deletions:** -{deletions}\n")
          lines.append("---")
          lines.append(f"**PR:** {server_url}/{repository}/pull/{pr_number}")

          Path("release_notes.md").write_text("\n".join(lines), encoding="utf-8")
          PYEOF

      - name: Create QA pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="qa-v${VERSION}-rc${PR_NUMBER}"

          # Delete existing release/tag for this PR+version if exists
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "QA: v${VERSION}-rc${PR_NUMBER}" \
            --notes-file release_notes.md \
            --prerelease \
            "${zip_name}"

      - name: Cleanup old QA pre-releases for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="qa-v${VERSION}-rc${PR_NUMBER}"

          gh release list --repo "${{ github.repository }}" --limit 50 \
            | grep "qa-v.*-rc${PR_NUMBER}" \
            | grep -v "${CURRENT_TAG}" \
            | awk '{print $1}' \
            | xargs -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "${zip_name}" release_notes.md pr_data.json || true
          rm -rf "${build_dir}" || true

  # ---------------------------------------------------------------------------
  # El aviso a Slack cubre TODAS las compuertas del PR, no sólo los tests.
  #
  # Hasta aca este job miraba UNICAMENTE `tests`. Las otras cuatro compuertas
  # del workflow —`sonarcloud`, `approve`, `qa-release` y `ready-to-prod`—
  # fallaban EN SILENCIO: el PR quedaba rojo (o directamente bloqueado) y en
  # Slack no aparecia nada.
  #
  # La peor de las cuatro es `sonarcloud`. `SonarCloud Code Analysis` es check
  # REQUERIDO de `main` con `enforce_admins: true`, y lo publica la app de Sonar
  # —no este job, que se llama `SonarCloud Analysis`—: si el escaner se cae
  # antes de subir el analisis, el contexto requerido NO REPORTA y el PR no se
  # pone rojo, se CONGELA. Y `approve` exige `needs.sonarcloud.result ==
  # 'success'`, asi que con el escaner caido tampoco hay zip de QA ni aviso de
  # Ready to PROD. Cero senales, tres consecuencias.
  #
  # `skipped` no dispara nada: las cuatro cuelgan de `tests`, asi que un fallo
  # de los tests las saltea en cascada — y saltarse no es fallar. Por lo mismo
  # el aviso de tests no se demora al sumar estos `needs`: si `tests` cae, las
  # cuatro se saltean en el acto.
  #
  # `lighthouse` no existe en este repo; si algun dia se agrega un job
  # informativo (`continue-on-error`), NO va en esta lista.
  # ---------------------------------------------------------------------------
