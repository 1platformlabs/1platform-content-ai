name: 1Platform Content AI — QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PHP_VERSION_PROD: "8.3"
  PHP_EXTENSIONS: "mbstring, xml, curl, mysql"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check (changed files)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_PHP=$(gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" --name-only | grep '\.php$' || true)
          if [ -z "$CHANGED_PHP" ]; then
            echo "No PHP files changed, skipping lint"
            exit 0
          fi
          ERRORS=0
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              if ! php -l "$file" 2>&1 | grep -q "No syntax errors"; then
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done <<< "$CHANGED_PHP"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::PHP syntax errors found in $ERRORS file(s)"
            exit 1
          fi
          echo "PHP syntax OK ($(echo "$CHANGED_PHP" | wc -l | tr -d ' ') files checked)"

      - name: Run PHPUnit (unit suite)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.php }}" = "8.3" ]; then
            vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage.xml -v 2>&1 | tee test_output.txt
          else
            vendor/bin/phpunit --testsuite=unit -v 2>&1 | tee test_output.txt
          fi
          tail -30 test_output.txt > test_summary.txt || true

      - name: PHPUnit — every test file must pass on its own
        if: matrix.php == env.PHP_VERSION_PROD
        shell: bash
        run: |
          set -euo pipefail
          # WP_Mock declares its stubs at PROCESS level, so a test that forgets
          # one still passes as long as some sibling declared it earlier in the
          # run. That green is an artefact of file order: filter the suite, shard
          # it, or just add a file that sorts earlier, and the test errors with
          # "Call to undefined function". Running every file in its own process
          # makes the omission fail here, on the PR that introduces it, instead
          # of surfacing later as an unexplained flake in someone else's branch.
          LOG=$(mktemp)
          FAILED=""
          COUNT=0
          while IFS= read -r f; do
            COUNT=$((COUNT + 1))
            if ! vendor/bin/phpunit "$f" > "$LOG" 2>&1; then
              FAILED="$FAILED $f"
              echo "::group::isolated failure — $f"
              tail -25 "$LOG"
              echo "::endgroup::"
            fi
          done < <(find tests/unit tests/integration -name '*Test.php' | sort)
          if [ -n "$FAILED" ]; then
            echo "::error::Test files that fail when run alone (they borrow WP_Mock stubs from a sibling test):$FAILED"
            exit 1
          fi
          echo "All $COUNT test files pass in isolation"

      - name: Run PHPUnit (integration suite)
        shell: bash
        run: |
          set -euo pipefail
          # Integration suite uses the same WP_Mock bootstrap as the unit
          # suite (multi-class lifecycle tests). A future expansion can
          # set WP_TESTS_DIR + start a MySQL service to swap in a real
          # WordPress install; see tests/integration/README.md.
          vendor/bin/phpunit --testsuite=integration -v 2>&1 | tee -a test_output.txt
          tail -30 test_output.txt > test_summary.txt || true

      - name: Validate version sync
        if: matrix.php == env.PHP_VERSION_PROD
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION=$(grep -oP "Version:\s*\K[\d.]+" 1platform-content-ai.php)
          README_VERSION=$(grep -oP "Stable tag:\s*\K[\d.]+" readme.txt)

          if [ -z "$PLUGIN_VERSION" ] || [ -z "$README_VERSION" ]; then
            echo "::error::Could not extract version from plugin header or readme.txt"
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "$README_VERSION" ]; then
            echo "::error::Version mismatch: plugin=$PLUGIN_VERSION readme=$README_VERSION"
            exit 1
          fi

          echo "Version sync OK: $PLUGIN_VERSION"

      - name: Upload coverage artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload test artifacts
        if: always() && matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-artifacts
          path: |
            test_output.txt
            test_summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f test_output.txt test_summary.txt || true

  sonarcloud:
    name: SonarCloud Analysis
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: QA
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
        continue-on-error: true

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  approve:
    name: Approve & Label
    # PR-only — labels and PR approvals don't apply to dispatch.
    needs: tests
    if: github.event_name == 'pull_request' && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      version: ${{ steps.detect_version.outputs.version }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Label PR as review-passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "ci:review-passed"

      - name: Detect version
        id: detect_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "Version:\s*\K[\d.]+" 1platform-content-ai.php)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  ready-to-prod:
    name: Ready to PROD
    # PR-only — merge-readiness signal is meaningless on dispatch.
    if: github.event_name == 'pull_request'
    needs: [approve]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: QA
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      VERSION: ${{ needs.approve.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Notify Slack — Ready to PROD
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_READY_TO_PROD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/slack_notify.py ready_to_prod

          if [ -n "${SLACK_WEBHOOK}" ]; then
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d @slack_payload.json \
              "${SLACK_WEBHOOK}"
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f slack_payload.json || true

  qa-release:
    name: QA Release (.zip)
    needs: approve
    if: needs.approve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      VERSION: ${{ needs.approve.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION_PROD }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Build plugin zip
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=$(mktemp -d)
          PLUGIN_DIR="${BUILD_DIR}/1platform-content-ai"
          mkdir -p "${PLUGIN_DIR}"

          # Copy files excluding .distignore entries
          if [ -f .distignore ]; then
            rsync -av --exclude-from='.distignore' ./ "${PLUGIN_DIR}/"
          else
            rsync -av \
              --exclude='.github' \
              --exclude='.claude' \
              --exclude='tests' \
              --exclude='.git' \
              --exclude='.gitignore' \
              --exclude='.editorconfig' \
              --exclude='composer.json' \
              --exclude='composer.lock' \
              --exclude='phpunit.xml.dist' \
              --exclude='CLAUDE.md' \
              --exclude='PIPELINE_PLAN.md' \
              --exclude='CHANGELOG.md' \
              --exclude='.distignore' \
              --exclude='vendor/bin' \
              ./ "${PLUGIN_DIR}/"
          fi

          ZIP_NAME="1platform-content-ai-qa-${VERSION}-rc${PR_NUMBER}.zip"
          cd "${BUILD_DIR}"
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" 1platform-content-ai/
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "build_dir=${BUILD_DIR}" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" \
            --json title,body,commits,files,additions,deletions > pr_data.json 2>/dev/null || echo '{}' > pr_data.json

          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          pr_number = os.environ.get("PR_NUMBER", "")
          version = os.environ.get("VERSION", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")

          data = json.loads(Path("pr_data.json").read_text(encoding="utf-8", errors="replace"))
          pr_title = data.get("title", f"PR #{pr_number}")
          pr_body = data.get("body", "")
          commits_list = data.get("commits", [])
          commits = "\n".join(f"- {c.get('messageHeadline', '')}" for c in commits_list) if commits_list else ""
          files_changed = len(data.get("files", []))
          additions = data.get("additions", 0)
          deletions = data.get("deletions", 0)

          lines = []
          lines.append(f"> ⚠️ **Pre-release — Not for production use.**\n")
          lines.append(f"### PR #{pr_number}: {pr_title}\n")

          if pr_body and pr_body != "null":
              lines.append("#### Description\n")
              lines.append(f"{pr_body}\n")

          if commits:
              lines.append("#### Commits\n")
              lines.append(f"{commits}\n")

          lines.append("#### Stats")
          lines.append(f"- **Files changed:** {files_changed}")
          lines.append(f"- **Additions:** +{additions}")
          lines.append(f"- **Deletions:** -{deletions}\n")
          lines.append("---")
          lines.append(f"**PR:** {server_url}/{repository}/pull/{pr_number}")

          Path("release_notes.md").write_text("\n".join(lines), encoding="utf-8")
          PYEOF

      - name: Create QA pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="qa-v${VERSION}-rc${PR_NUMBER}"

          # Delete existing release/tag for this PR+version if exists
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "QA: v${VERSION}-rc${PR_NUMBER}" \
            --notes-file release_notes.md \
            --prerelease \
            "${zip_name}"

      - name: Cleanup old QA pre-releases for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="qa-v${VERSION}-rc${PR_NUMBER}"

          gh release list --repo "${{ github.repository }}" --limit 50 \
            | grep "qa-v.*-rc${PR_NUMBER}" \
            | grep -v "${CURRENT_TAG}" \
            | awk '{print $1}' \
            | xargs -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "${zip_name}" release_notes.md pr_data.json || true
          rm -rf "${build_dir}" || true

  notify:
    name: Slack Notification
    needs: [tests]
    if: always() && needs.tests.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: QA
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download test artifacts
        if: needs.tests.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: qa-test-artifacts
          path: .
        continue-on-error: true

      - name: Notify Slack — QA tests failed
        if: needs.tests.result == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_QA }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/slack_notify.py tests_failed

          if [ -n "${SLACK_WEBHOOK}" ]; then
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d @slack_payload.json \
              "${SLACK_WEBHOOK}"
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f slack_payload.json test_summary.txt test_output.txt || true
