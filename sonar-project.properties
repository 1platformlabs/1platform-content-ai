sonar.projectKey=1platformlabs_1platform-content-ai
sonar.organization=1platformlabs

sonar.sources=includes,1platform-content-ai.php
sonar.tests=tests
sonar.php.version=8.3
sonar.php.coverage.reportPaths=coverage.xml

sonar.exclusions=vendor/**,node_modules/**
# The WordPress bootstrap file is never loaded by the WP_Mock suite (its measured
# coverage is 0.0%), so any executable line added to it reads as uncovered no matter
# what the tests prove — the new-code coverage gate then measures the file, not the
# change. It is still analysed for issues; what it must contain is pinned by text
# contracts (tests/unit/helpers/PluginHeaderVersionTest.php, issue #209).
sonar.coverage.exclusions=1platform-content-ai.php
# `sonar.test.exclusions=tests/**` estaba aca y VACIABA el `sonar.tests=tests` de
# arriba: declararlos y borrarlos en la linea siguiente. Medido contra la API en
# `1platform-atlas-api`, que tenia exactamente el mismo par: CERO archivos de test
# indexados, contra los 300 de `bower-api`, que declara lo mismo SIN la exclusion.
# Declararlos no consume cuota — un archivo de test cuenta 0 lineas de codigo.

sonar.sourceEncoding=UTF-8
